# Application
spring.application.name=country-city-service
server.port=8080

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:indiadb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=ujjawal
spring.datasource.password=ujjawal123

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

# Run data.sql at startup
spring.sql.init.mode=always

# H2 console (development only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Swagger UI / OpenAPI (works after you add the springdoc dependency)
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
